spring.application.name=veterinaria

spring.datasource.url=jdbc:mysql://localhost:3308/veterinaria_db?serverTimezone=America/Bogota
spring.datasource.username=root
spring.datasource.password=12345678
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# Origenes del frontend (Live Server de Visual Studio Code usa el puerto 5500)
app.cors.origenes=http://localhost:*,http://127.0.0.1:*

# Swagger: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
